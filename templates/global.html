<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TopDeck{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('home') }}" class="logo">TopDeck</a>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="#">Browse</a>
      <a href="#">Polls</a>
      <a href="#">Add a Card</a>
    </nav>
    <a href="#" class="btn btn-secondary">Sign in</a>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>TopDeck · CSI 3210 · Fall 2026</p>
  </footer>
</body>
</html>
